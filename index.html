<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#16151D">
    <link rel="icon" href="assets/focuslogo48.png">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
</head>
<body>
    <div class="top">
        <div class="modes">
            <button class="mode active" id="focus">Focus</button>
            <button class="mode" id="time">Time</button>
        </div>
        <div class="timer" id="timerDisplay" role="button" tabindex="0" aria-label="Set session duration">
            <span id="hrs">00</span>:<span id="mins">00</span>:<span id="secs">00</span>
        </div>

        <div class="tags">
            <div class="tag" id="studyTag" role="button" tabindex="0">
                <span class="session-indicator" aria-hidden="true">●</span>Study
            </div>
            <div class="tag selected" id="workTag" role="button" tabindex="0">
                <span class="session-indicator" aria-hidden="true">●</span>Work
            </div>
            <div class="tag" id="otherTag" role="button" tabindex="0">
                <span class="session-indicator" aria-hidden="true">●</span>Other
            </div>
        </div>
    </div>
    
    <form id="durationForm" class="duration-form" hidden>
        <label>
            Hours
            <input id="hrsInput" type="number" min="0" max="99" value="0" required>
        </label>
        <label>
            Minutes
            <input id="minutesInput" type="number" min="0" max="59" value="25" required>
        </label>
        <button type="submit">Set duration</button>
    </form>

    <div id="sessionControls">
        <button id="startButton" type="button">Start Focus</button>
        <button id="stopButton" type="button" hidden>Stop Session</button>
        <button id="resumeButton" type="button" hidden>Resume</button>
    </div>
    <p id="pauseHint">Click on timer to change duration | Hover over Category to select</p>

    <dialog id="shortcutsDialog">
        <h1>Shortcuts</h1>
        <ul class="down">
            <li><kbd>/</kbd>Show & Hide Shortcuts</li>
            <li><kbd>W</kbd>Toggle Mode</li>
            <li><kbd>T</kbd>Set duration</li>
            <li><kbd>SPACE</kbd>Start, Pause, Resume session</li>
            <li><kbd>Q</kbd>Stop session</li>
        </ul>
    </dialog>
    <button id="shortcutsButton" type="button">/</button>

    <script src="app.js"></script>
</body>
</html>
